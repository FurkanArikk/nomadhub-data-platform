name: 'nomad_hub'
version: '2.0.0'
config-version: 2
profile: 'nomad_hub'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# ── Layers ────────────────────────────────────────────────────────────────────
#   STAGING  one view per RAW table: typed, cleaned, deduplicated (+ seeds)
#   MARTS    dimensions (tables), incremental facts (MERGE), business marts (tables)
models:
  nomad_hub:
    staging:
      +schema: STAGING
      +materialized: view
      +tags: ["staging"]
    marts:
      +schema: MARTS
      dimensions:
        +materialized: table
        +tags: ["dimension"]
      facts:
        +materialized: incremental
        +incremental_strategy: merge
        +on_schema_change: append_new_columns
        +tags: ["fact"]
      business:
        +materialized: table
        +tags: ["mart"]
      ai:                          # needs ai/enrich_reviews.py to have run: dbt build --select tag:ai
        +schema: AI
        +materialized: table
        +tags: ["ai"]

seeds:
  nomad_hub:
    +schema: STAGING
    +tags: ["seed"]
    fx_rates_daily:
      +column_types:
        rate_date: date
        currency_code: varchar(3)
        usd_per_unit: number(18,8)
    airlines:
      +column_types:
        airline_code: varchar(3)
        parent_airline_code: varchar(3)

vars:
  date_spine_start: '2014-01-01'
  date_spine_end: '2027-12-31'
