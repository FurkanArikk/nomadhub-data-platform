version: 2

sources:
  - name: raw
    database: NOMAD_HUB
    schema: RAW
    description: "Bronze layer — raw tables loaded via COPY INTO from S3"

    # Freshness checks (run: dbt source freshness)
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: CREATED_AT

    tables:
      - name: countries
        description: "ISO country reference data"
        columns:
          - name: COUNTRY_CODE
            tests: [unique, not_null]
          - name: COUNTRY_NAME
            tests: [not_null]
          - name: REGION
            tests: [not_null]

      - name: airports
        description: "Airport catalog with IATA codes"
        columns:
          - name: AIRPORT_ID
            tests: [unique, not_null]
          - name: IATA_CODE
            tests: [unique, not_null]

      - name: hotels
        description: "Hotel property profiles"
        columns:
          - name: HOTEL_ID
            tests: [unique, not_null]
          - name: CATEGORY
            tests:
              - accepted_values:
                  values: ["Budget", "Economy", "Midscale", "Upscale", "Luxury", "Ultra-Luxury"]
          - name: STAR_RATING
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 1
                  max_value: 5

      - name: users
        description: "User accounts and preferences"
        columns:
          - name: USER_ID
            tests: [unique, not_null]
          - name: EMAIL
            tests: [not_null]
          - name: LOYALTY_TIER
            tests:
              - accepted_values:
                  values: ["Bronze", "Silver", "Gold", "Platinum"]

      - name: flights
        description: "Flight booking fact table"
        columns:
          - name: FLIGHT_ID
            tests: [unique, not_null]
          - name: BOOKING_STATUS
            tests:
              - accepted_values:
                  values: ["confirmed", "cancelled", "completed", "no_show"]
          - name: TOTAL_FARE_USD
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 0
                  max_value: 200000

      - name: hotel_bookings
        description: "Hotel reservation fact table"
        columns:
          - name: BOOKING_ID
            tests: [unique, not_null]
          - name: BOOKING_STATUS
            tests:
              - accepted_values:
                  values: ["confirmed", "cancelled", "completed", "no_show"]
          - name: NUM_NIGHTS
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 1
                  max_value: 365

      - name: reviews
        description: "Free-text travel reviews"
        columns:
          - name: REVIEW_ID
            tests: [unique, not_null]
          - name: RATING
            tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  min_value: 1
                  max_value: 5
          - name: REVIEW_TYPE
            tests:
              - accepted_values:
                  values: ["flight", "hotel", "destination"]
