# Project metadata and tool config. This is an application, not an installable package:
# dependencies live in requirements.txt (local dev), airflow/Dockerfile and dashboard/Dockerfile.

[project]
name = "nomadhub"
version = "2.0.0"
description = "AI-powered travel data platform: S3 → Snowflake → dbt → Airflow → Gemini → Streamlit, on ~294M rows of real public data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FurkanArikk" }]
keywords = ["data-engineering", "snowflake", "dbt", "airflow", "terraform", "gemini", "rag", "streamlit"]

[project.urls]
Repository = "https://github.com/FurkanArikk/zomata_data_eng"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# scripts import siblings directly (python ai/rag.py, python data/generate_data.py)
known-first-party = ["common", "enrich_reviews", "rag", "text_to_sql", "sources", "nomad"]
