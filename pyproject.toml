[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nomad-hub-data-engineering"
version = "1.0.0"
description = "AI-powered travel data engineering pipeline: S3 → Snowflake → dbt → Gemini → Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your@email.com" }]
keywords = ["data-engineering", "dbt", "snowflake", "airflow", "gemini", "streamlit"]

[project.urls]
Repository = "https://github.com/yourusername/nomad-hub-data-engineering"

# ── Data Generator ────────────────────────────────────────────────────────────
[project.optional-dependencies]
generator = [
    "faker>=26.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

# ── AWS Upload ─────────────────────────────────────────────────────────────────
aws = [
    "boto3>=1.34",
    "tqdm>=4.66",
]

# ── dbt ───────────────────────────────────────────────────────────────────────
dbt = [
    "dbt-snowflake>=1.8",
    "dbt-core>=1.8",
]

# ── Airflow ───────────────────────────────────────────────────────────────────
airflow = [
    "apache-airflow>=3.0",
    "apache-airflow-providers-snowflake>=5.3",
    "apache-airflow-providers-amazon>=8.25",
]

# ── AI Layer ──────────────────────────────────────────────────────────────────
ai = [
    "google-generativeai>=0.7",
    "faiss-cpu>=1.8",
    "snowflake-connector-python>=3.12",
    "pandas>=2.2",
    "tqdm>=4.66",
]

# ── Streamlit Dashboard ───────────────────────────────────────────────────────
streamlit = [
    "streamlit>=1.37",
    "plotly>=5.23",
    "pandas>=2.2",
    "snowflake-connector-python>=3.12",
    "google-generativeai>=0.7",
    "faiss-cpu>=1.8",
]

# ── All dev dependencies ──────────────────────────────────────────────────────
dev = [
    "nomad-hub-data-engineering[generator,aws,ai,streamlit]",
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
