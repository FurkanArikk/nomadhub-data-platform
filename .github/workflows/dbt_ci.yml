name: CI — dbt parse & Python lint

on:
  pull_request:
    paths:
      - "nomad_hub/**"
      - ".github/workflows/dbt_ci.yml"
  push:
    branches: [main]
    paths:
      - "nomad_hub/**"

jobs:
  dbt-parse:
    name: dbt parse (no warehouse needed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nomad_hub
    env:
      # parse never connects; the profile just needs a value to render
      SNOWFLAKE_ACCOUNT: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt-snowflake
        run: pip install "dbt-snowflake~=1.12.0"

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt parse — SQL, refs, YAML and tests must all resolve
        run: dbt parse --profiles-dir .

  lint:
    name: Python linting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python files
        run: ruff check data/ scripts/ ai/ streamlit/ airflow/dags/
